[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mirofish-os"
version = "0.1.0"
description = "Universal Autonomous AI Operating System"
authors = [
    {name = "Elite Engineer", email = "elite@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.23.0",
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "aiosqlite>=0.19.0",
    "playwright>=1.40.0",
    "faster-whisper>=0.10.0",
    "edge-tts>=6.1.9",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "groq>=0.4.0",
    "google-generativeai>=0.3.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.2",
    "pyyaml>=6.0.1",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1",
    "ruff>=0.1.5",
    "mypy>=1.6.1"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
